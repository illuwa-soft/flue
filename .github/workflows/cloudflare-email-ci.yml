name: Community Cloudflare email checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [community]
    paths:
      - 'packages/cloudflare-email/**'
      - 'examples/cloudflare-email/**'
      - 'blueprints/channel--cloudflare-email.md'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cloudflare-email-*.yml'
  pull_request:
    branches: [community]
    paths:
      - 'packages/cloudflare-email/**'
      - 'examples/cloudflare-email/**'
      - 'blueprints/channel--cloudflare-email.md'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cloudflare-email-*.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'illuwa-soft/flue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: ['2.3.0', '^2.3.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=cloudflare-email-example... --filter=@flue/cli...
      - run: pnpm --filter @illuwa-soft/flue-cloudflare-email check:types
      - run: pnpm --filter @illuwa-soft/flue-cloudflare-email test
      - run: pnpm --filter cloudflare-email-example cf-typegen
      - run: pnpm --filter cloudflare-email-example check:types
      - run: pnpm --filter cloudflare-email-example test
      - run: pnpm --filter cloudflare-email-example test:workerd
      - run: pnpm --filter cloudflare-email-example test:blueprint
      - run: pnpm --filter @illuwa-soft/flue-cloudflare-email test:consumer
        env:
          FLUE_CONSUMER_VERSION: ${{ matrix.runtime }}
      - run: pnpm exec biome check packages/cloudflare-email examples/cloudflare-email
      - run: pnpm exec prettier --check packages/cloudflare-email examples/cloudflare-email
      - run: git diff --check
