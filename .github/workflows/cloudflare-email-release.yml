name: Stage community Cloudflare email release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to stage (never publishes automatically)
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'illuwa-soft/flue' && github.ref == 'refs/heads/community'
    uses: ./.github/workflows/cloudflare-email-ci.yml
  stage:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1
      - run: npm install --global npm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@illuwa-soft/flue-cloudflare-email...
      - run: pnpm --filter @illuwa-soft/flue-cloudflare-email release:check
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Pack and stage only this verified package
        working-directory: packages/cloudflare-email
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflare-email-release"
          pnpm pack --pack-destination "$RUNNER_TEMP/cloudflare-email-release"
          npm stage publish "$RUNNER_TEMP/cloudflare-email-release/illuwa-soft-flue-cloudflare-email-$RELEASE_VERSION.tgz" --access public
        env:
          RELEASE_VERSION: ${{ inputs.version }}
